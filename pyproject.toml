[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jfia-forensic"
version = "0.1.0"
description = "Forensic accounting detectlet schema and JFIA literature catalog tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "PyYAML>=6",
    "anthropic>=0.30",
    "pandas>=2",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jfia_forensic"]

[tool.uv]
compile-bytecode = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
